name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/clinical-record-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/legacy-bridge-linux-amd64 ./cmd/legacy_bridge
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/clinical-record-windows-amd64.exe ./cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/legacy-bridge-windows-amd64.exe ./cmd/legacy_bridge
          
          # macOS (Intel & Silicon)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/clinical-record-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/legacy-bridge-darwin-amd64 ./cmd/legacy_bridge
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/clinical-record-darwin-arm64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/legacy-bridge-darwin-arm64 ./cmd/legacy_bridge

          # Compress binaries
          cd dist
          tar -czvf vincula-salud-linux-amd64.tar.gz clinical-record-linux-amd64 legacy-bridge-linux-amd64
          zip vincula-salud-windows-amd64.zip clinical-record-windows-amd64.exe legacy-bridge-windows-amd64.exe
          tar -czvf vincula-salud-darwin-amd64.tar.gz clinical-record-darwin-amd64 legacy-bridge-darwin-amd64
          tar -czvf vincula-salud-darwin-arm64.tar.gz clinical-record-darwin-arm64 legacy-bridge-darwin-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
